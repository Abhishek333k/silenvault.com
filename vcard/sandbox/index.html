<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilenVault vCard Design Sandbox &amp; AI Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --panel: #0d111a;
            --panel-border: rgba(255, 255, 255, 0.08);
            --cyan: #00f0ff;
            --violet: #8b5cf6;
            --emerald: #10b981;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            background: rgba(13, 17, 26, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 14px;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Switcher Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: rgba(0, 240, 255, 0.12);
            color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Viewport Resizer */
        .viewport-selector {
            display: flex;
            gap: 6px;
        }

        .vp-btn {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vp-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0, 240, 255, 0.08);
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            gap: 20px;
        }

        /* Model Attribution Banner */
        .attribution-card {
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .model-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .model-badge {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #c4b5fd;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .model-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .direct-link-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .direct-link-btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        /* Preview Frame */
        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .device-frame {
            width: 410px;
            height: 820px;
            border: 10px solid #1a1e29;
            border-radius: 46px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.06);
            transition: all 0.3s ease;
            position: relative;
            background: #000;
        }

        .device-frame.tablet {
            width: 680px;
            height: 840px;
            border-radius: 36px;
        }

        .device-frame.full {
            width: 100%;
            max-width: 1100px;
            height: 860px;
            border-radius: 20px;
            border-width: 2px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-title">
            <div class="brand-logo">SV</div>
            <div class="brand-text">
                <h1>vCard Architecture Sandbox</h1>
                <p>silenvault.com/vcard/sandbox</p>
            </div>
        </div>

        <div class="controls">
            <button class="tab-btn active" onclick="switchConcept('concept_diffusiongemma.html', 'DiffusionGemma-26B', 'Obsidian Glass Command Deck with 4-button Bento Grid, rotating neural avatar ring, and instant modal QR code.')">
                <span>⚡ Concept A: DiffusionGemma</span>
            </button>
            <button class="tab-btn" onclick="switchConcept('concept_vanguard.html', 'Agent Vanguard', 'Cyber-Minimalist Executive with interactive 3D Card-Flip gesture (Front Profile / Back High-Speed QR Scanner).')">
                <span>🛡️ Concept B: Vanguard</span>
            </button>
            <button class="tab-btn" onclick="switchConcept('../index.html', 'Current Baseline', 'The basic initial implementation (flat dark box with emojis).')">
                <span>⏪ Current Baseline</span>
            </button>
        </div>

        <div class="viewport-selector">
            <button class="vp-btn active" onclick="setViewport('phone')">📱 Phone</button>
            <button class="vp-btn" onclick="setViewport('tablet')">💻 Tablet</button>
            <button class="vp-btn" onclick="setViewport('full')">🖥️ Wide</button>
        </div>
    </header>

    <main>
        <div class="attribution-card">
            <div class="model-info">
                <span id="conceptBadge" class="model-badge">DiffusionGemma-26B</span>
                <span id="conceptSummary" class="model-desc">Obsidian Glass Command Deck with 4-button Bento Grid, rotating neural avatar ring, and instant modal QR code.</span>
            </div>
            <a id="directLink" href="concept_diffusiongemma.html" target="_blank" class="direct-link-btn">
                <span>Open in New Tab</span>
                <span>↗</span>
            </a>
        </div>

        <div class="preview-wrapper">
            <div id="deviceFrame" class="device-frame">
                <iframe id="previewIframe" src="concept_diffusiongemma.html"></iframe>
            </div>
        </div>
    </main>

    <script>
        function switchConcept(url, model, summary) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('previewIframe').src = url;
            document.getElementById('conceptBadge').textContent = model;
            document.getElementById('conceptSummary').textContent = summary;
            document.getElementById('directLink').href = url;
        }

        function setViewport(mode) {
            document.querySelectorAll('.vp-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const frame = document.getElementById('deviceFrame');
            frame.className = 'device-frame ' + (mode === 'phone' ? '' : mode);
        }
    </script>
</body>
</html>
